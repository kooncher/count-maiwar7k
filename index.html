<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ไม้ War</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
/* layout: pick player -> big counter -> tap tiles per group; round + edit tucked in the header */
:root{--bg:#f5f6f8;--panel:#fff;--fg:#1b2026;--muted:#6a7380;--line:#e2e5ea;--accent:#2f6fde;--g0:#cf3a3a;--g1:#2f6fde;--g2:#c97d12;--g3:#9343c4;--font:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--panel:#191c20;--fg:#e6e9ed;--muted:#8a93a0;--line:#2a2f36;--accent:#6c9cf6;--g0:#f07575;--g1:#6c9cf6;--g2:#eeae4c;--g3:#c78cf0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111316;--panel:#191c20;--fg:#e6e9ed;--muted:#8a93a0;--line:#2a2f36;--accent:#6c9cf6;--g0:#f07575;--g1:#6c9cf6;--g2:#eeae4c;--g3:#c78cf0;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;font-size:14px;background:var(--bg);color:var(--fg);font-family:var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
main{max-width:720px;margin:0 auto;display:grid;gap:16px}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:20px;font-weight:600;margin:0;flex:1}
select{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;max-width:50vw}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;white-space:nowrap;font-size:14px}
.users{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;white-space:nowrap;font-size:15px}
.chip[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.count{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.count b{font-size:40px;line-height:1;font-weight:600}
.count span{color:var(--muted)}
.status{font-size:12px;color:var(--muted);margin-left:auto}
.grp h2{font-size:12px;letter-spacing:.06em;font-weight:600;margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{position:relative;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);padding:8px 10px;text-align:left;font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tile[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;font-size:13px}
.edit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.edit label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
textarea,input{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{min-height:220px;resize:vertical}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--g0)}
@media (prefers-reduced-motion:no-preference){.tile{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>ไม้ War</h1>
    <select id="round" aria-label="รอบ"></select>
    <button class="btn" id="toggleEdit">แก้ไข</button>
  </div>
  <div class="users" id="users"></div>
  <div class="count"><b id="used">0</b><span id="of">ใช้ไปแล้ว</span><span class="status" id="status"></span></div>
  <div id="grid" style="display:grid;gap:18px"></div>
  <section class="edit" id="edit" hidden>
    <label>ชื่อรอบ<input id="roundName"></label>
    <label>ผู้เล่น (บรรทัดละคน)<textarea id="players"></textarea></label>
    <label>ตัวละคร (ขึ้นกลุ่มใหม่ด้วย # ชื่อกลุ่ม)<textarea id="heroes"></textarea></label>
    <div class="actions">
      <button class="btn primary" id="applyEdit">บันทึกการแก้ไข</button>
      <button class="btn" id="addRound">+ เริ่มรอบใหม่</button>
      <button class="btn danger" id="clearRound">ล้างติ๊กรอบนี้</button>
      <button class="btn danger" id="delRound">ลบรอบนี้</button>
    </div>
  </section>
</main>

<script type="application/json" id="state">{"players":["Fake1ToTwo","Kyoran","Qwerty02","คิดดีมั้ย","Mirowastaken","AOFTONGJ"],"groups":[{"name":"แดง","heroes":["ลิปโป","แฝด","ไคล์","เทโอ","คารุระ","แรนกริด","ไพร","ไรอัน","เอมิเลีย","คาเสรอน","ไคล์ (2)","ซอริน","ทันจิโร่","เซ็นอิตสึ","ออก้า","บาลีสต้า"]},{"name":"น้ำเงิน","heroes":["เฟรยา","เรกิแนฟ","มิเลีย","โอมัก","รีน","ซงจินอู","ศิริเอล","ซิลเวสต้า","วาเนซซ่า","ยูนกอน"]},{"name":"ส้ม","heroes":["แซคกริด","ลูดี้","นีออ","อาไกล่า","ดาราภณ"]},{"name":"ม่วง","heroes":["ลีง","เกล","ธรูด","อไปด์","พารามอส","เอลิเซีย","เลย"]}],"rounds":[{"name":"รอบ 1","used":{"ลิปโป":["Fake1ToTwo"],"แฝด":["Fake1ToTwo"],"ไคล์":["Fake1ToTwo"],"ไพร":["Kyoran"],"ไรอัน":["Kyoran"]}}]}</script>

<script>
// Data lives in this browser's localStorage; the JSON block above is only the starting set.
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S = JSON.parse($('state').textContent);
try { const l = localStorage.getItem('maiwar'); if (l) S = JSON.parse(l); } catch {}
let cur = S.rounds.length - 1, me = '';
try { me = localStorage.getItem('maiwar-me') || ''; } catch {}

function heroList() { return S.groups.flatMap(g => g.heroes); }

function render() {
  const used = S.rounds[cur].used;
  if (!S.players.includes(me)) me = S.players[0] || '';
  $('round').innerHTML = S.rounds.map((r, i) => `<option value="${i}"${i === cur ? ' selected' : ''}>${esc(r.name)}</option>`).join('');
  $('users').innerHTML = S.players.map(p =>
    `<button class="chip" data-u="${esc(p)}" aria-current="${p === me}">${esc(p)}</button>`).join('');
  const total = heroList().length, n = Object.values(used).filter(a => a.includes(me)).length;
  $('used').textContent = n;
  $('of').textContent = `ใช้ไปแล้ว จาก ${total} ตัว`;
  let idx = 0;
  $('grid').innerHTML = S.groups.map((g, gi) =>
    `<section class="grp" style="--c:var(--g${gi % 4})"><h2 style="color:var(--c)">${esc(g.name)}</h2><div class="tiles">` +
    g.heroes.map(name => `<button class="tile" data-h="${idx++}" aria-pressed="${(used[name] || []).includes(me)}">${esc(name)}</button>`).join('') +
    `</div></section>`).join('');
}

function save() {
  try { localStorage.setItem('maiwar', JSON.stringify(S)); $('status').textContent = 'บันทึกแล้ว'; }
  catch { $('status').textContent = 'บันทึกไม่ได้ (โหมดส่วนตัว?)'; }
}

$('grid').addEventListener('click', e => {
  const b = e.target.closest('[data-h]'); if (!b || !me) return;
  const name = heroList()[+b.dataset.h], used = S.rounds[cur].used, a = used[name] || [];
  used[name] = a.includes(me) ? a.filter(x => x !== me) : [...a, me];
  if (!used[name].length) delete used[name];
  render(); save();
});
$('round').onchange = e => { cur = +e.target.value; render(); if (!$('edit').hidden) fillEdit(); };
$('users').addEventListener('click', e => {
  const b = e.target.closest('[data-u]'); if (!b) return;
  me = b.dataset.u; try { localStorage.setItem('maiwar-me', me); } catch {} // remembered per device
  render();
});
$('addRound').onclick = () => {
  S.rounds.push({ name: 'รอบ ' + (S.rounds.length + 1), used: {} });
  cur = S.rounds.length - 1; render(); save(); fillEdit();
};

function fillEdit() {
  $('roundName').value = S.rounds[cur].name;
  $('players').value = S.players.join('\n');
  $('heroes').value = S.groups.map(g => '# ' + g.name + '\n' + g.heroes.join('\n')).join('\n\n');
  armed = {};
  $('clearRound').textContent = 'ล้างติ๊กรอบนี้'; $('delRound').textContent = 'ลบรอบนี้';
}
function parseHeroes(text) {
  const groups = [];
  for (const raw of text.split('\n')) {
    const l = raw.trim(); if (!l) continue;
    if (l.startsWith('#')) groups.push({ name: l.slice(1).trim() || 'กลุ่ม', heroes: [] });
    else { if (!groups.length) groups.push({ name: 'กลุ่ม', heroes: [] }); groups[groups.length - 1].heroes.push(l); }
  }
  return groups;
}
$('toggleEdit').onclick = () => { const ed = $('edit'); ed.hidden = !ed.hidden; if (!ed.hidden) fillEdit(); };
$('applyEdit').onclick = () => {
  S.rounds[cur].name = $('roundName').value.trim() || S.rounds[cur].name;
  S.players = $('players').value.split('\n').map(s => s.trim()).filter(Boolean);
  S.groups = parseHeroes($('heroes').value);
  $('edit').hidden = true; render(); save();
};
// Destructive buttons need a second tap (no confirm() in the viewer).
let armed = {};
function twoTap(id, act) {
  $(id).onclick = () => {
    if (!armed[id]) { armed[id] = 1; $(id).textContent = 'แตะอีกครั้งเพื่อยืนยัน'; return; }
    act(); fillEdit(); render(); save();
  };
}
twoTap('clearRound', () => { S.rounds[cur].used = {}; });
twoTap('delRound', () => {
  if (S.rounds.length === 1) S.rounds[0] = { name: 'รอบ 1', used: {} };
  else { S.rounds.splice(cur, 1); cur = Math.max(0, cur - 1); }
});

render();
</script>
</body>
</html>
